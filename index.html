<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location Map App</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Location Map</h1>
            <p class="subtitle">Find and display your current location</p>
        </header>

        <main class="main-content">
            <!-- Controls Section -->
            <div class="controls">
                <button id="getLocationBtn" class="btn btn-primary">
                    <span class="btn-icon">📍</span>
                    Get My Location
                </button>
                <div id="statusMessage" class="status-message"></div>
            </div>

            <!-- Location Info Section -->
            <div id="locationInfo" class="location-info hidden">
                <h2>Your Location</h2>
                <div class="info-grid">
                    <div class="info-item">
                        <span class="info-label">Latitude:</span>
                        <span id="latitude" class="info-value">-</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Longitude:</span>
                        <span id="longitude" class="info-value">-</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Accuracy:</span>
                        <span id="accuracy" class="info-value">-</span>
                    </div>
                </div>
            </div>

            <!-- Map Section -->
            <div id="mapContainer" class="map-container">
                <div id="map"></div>
            </div>
        </main>

        <footer class="footer">
            <p>Built with Leaflet.js | Modular architecture for easy extension</p>
        </footer>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>

    <!-- App JS Modules -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
